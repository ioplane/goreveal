# SonarQube Cloud analysis configuration.
#
# Bound to the SonarQube Cloud project ioplane/goreveal. The SONAR_TOKEN
# repository secret authenticates the scan; see docs/RELEASE.md.
sonar.organization=ioplane
sonar.projectKey=ioplane_goreveal

sonar.projectName=GoREveal
sonar.projectDescription=Clean-room reverse-engineering platform for Go binaries
sonar.links.homepage=https://github.com/ioplane/goreveal
sonar.links.scm=https://github.com/ioplane/goreveal
sonar.links.issue=https://github.com/ioplane/goreveal/issues

sonar.sourceEncoding=UTF-8

# --- Scope --------------------------------------------------------------------
# The repository root is the analysis scope; exclusions below carve out
# everything that is not first-party source.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go,**/test_*.py

sonar.exclusions=\
  **/vendor/**,\
  **/node_modules/**,\
  **/__pycache__/**,\
  .tmp/**,\
  dist/**,\
  docs/.local/**,\
  corpus/fixtures/**,\
  corpus/protected/**,\
  corpus/generated/**,\
  tests/snapshots/**/*.json

# Corpus sources are deliberately small, odd, or intentionally obfuscated Go
# programs built as analysis targets. Linting them as production code produces
# only noise.
sonar.coverage.exclusions=\
  **/*_test.go,\
  **/test_*.py,\
  corpus/**,\
  scripts/dev/**,\
  plugins/**

# --- Go -----------------------------------------------------------------------
sonar.go.coverage.reportPaths=coverage.out
sonar.go.exclusions=**/vendor/**,corpus/**,.tmp/**

# --- Python -------------------------------------------------------------------
sonar.python.version=3.14

# --- Duplication --------------------------------------------------------------
# Export encoders and their fixture tests are structurally repetitive by design:
# each one freezes a wire contract, and collapsing them would couple contracts
# that must stay independently versioned.
sonar.cpd.exclusions=\
  schema/export_*.go,\
  tests/snapshots/**,\
  plugins/**
