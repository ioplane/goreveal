[project]
name = "goreveal-automation"
version = "0.1.0"
description = "Python automation helpers for Podman-first GoREveal workflows."
requires-python = ">=3.11"
dependencies = [
  "podman>=5.7,<6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["plugins", "scripts"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = [
  "A",
  "ANN",
  "ARG",
  "ASYNC",
  "B",
  "BLE",
  "C4",
  "COM",
  "DTZ",
  "E",
  "EM",
  "ERA",
  "EXE",
  "F",
  "FA",
  "FLY",
  "FURB",
  "G",
  "I",
  "ICN",
  "INP",
  "ISC",
  "LOG",
  "N",
  "PERF",
  "PIE",
  "PT",
  "PTH",
  "Q",
  "RET",
  "RSE",
  "RUF",
  "S",
  "SIM",
  "SLOT",
  "T10",
  "TC",
  "TID",
  "TRY",
  "UP",
  "W",
  "YTT",
]
ignore = [
  "ANN401",
  "COM812",
  "EM101",
  "EM102",
  "ERA001",
  "G004",
  "INP001",
  "ISC001",
  "PLR2004",
  "RUF012",
  "S603",
  "S607",
  "TC003",
  "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"plugins/*/test_*.py" = ["PT009", "PT027", "S101", "S108"]
"scripts/**/test_*.py" = ["PT009", "PT027", "S101", "S108"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["plugins", "scripts"]
