[project]
name = "goreveal-automation"
version = "0.1.0"
description = "Python automation helpers for Podman-first GoREveal workflows."
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "The GoREveal Authors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
  "Topic :: Software Development :: Disassemblers",
]
dependencies = [
  "podman>=5.7,<6",
]

[project.urls]
Homepage = "https://github.com/ioplane/goreveal"
Repository = "https://github.com/ioplane/goreveal"
Issues = "https://github.com/ioplane/goreveal/issues"
Changelog = "https://github.com/ioplane/goreveal/blob/main/CHANGELOG.md"

# PEP 735 dependency group consumed by `uv sync --group dev` in CI and locally.
# Versions are floors, not pins: `uv.lock` is the reproducibility boundary.
[dependency-groups]
dev = [
  "ruff>=0.16.1",
  "ty>=0.0.65",
  "yamllint>=1.38.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts", "plugins"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["plugins", "scripts"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = [
  "A",
  "ANN",
  "ARG",
  "ASYNC",
  "B",
  "BLE",
  "C4",
  "COM",
  "DTZ",
  "E",
  "EM",
  "ERA",
  "EXE",
  "F",
  "FA",
  "FLY",
  "FURB",
  "G",
  "I",
  "ICN",
  "INP",
  "ISC",
  "LOG",
  "N",
  "PERF",
  "PIE",
  "PT",
  "PTH",
  "Q",
  "RET",
  "RSE",
  "RUF",
  "S",
  "SIM",
  "SLOT",
  "T10",
  "TC",
  "TID",
  "TRY",
  "UP",
  "W",
  "YTT",
]
ignore = [
  "ANN401",
  "COM812",
  "EM101",
  "EM102",
  "ERA001",
  "G004",
  "INP001",
  "ISC001",
  "PLR2004",
  "RUF012",
  "S603",
  "S607",
  "TC003",
  "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"plugins/*/test_*.py" = ["PT009", "PT027", "S101", "S108"]
"scripts/**/test_*.py" = ["PT009", "PT027", "S101", "S108"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["plugins", "scripts"]

[tool.ty.environment]
python-version = "3.14"
root = ["plugins", "scripts"]

[tool.ty.src]
exclude = [
  ".tmp",
  "corpus/generated",
  "docs/.local",
]

[tool.ty.rules]
# The IDA and Ghidra plugin entrypoints import host-tool modules (`idaapi`,
# `ghidra.*`) that only exist inside those tools. They are unresolvable in CI by
# design, so unresolved-import is downgraded rather than suppressed per-line.
unresolved-import = "warn"
