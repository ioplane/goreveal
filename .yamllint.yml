---
extends: default

ignore: |
  .serena/
  node_modules/
  pnpm-lock.yaml

rules:
  document-start:
    present: true
  line-length:
    max: 100
    allow-non-breakable-words: true
    allow-non-breakable-inline-mappings: false
  truthy:
    allowed-values: ["true", "false"]
    check-keys: true
  comments:
    min-spaces-from-content: 1
  comments-indentation: enable
