---
name: Release

# yamllint disable-line rule:truthy
on:
  # release-please (with a PAT) publishes a GitHub Release, which fires this.
  release:
    types:
      - published
  # A manual `git push` of a version tag also publishes.
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify everything without publishing
        type: boolean
        default: true

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.26.5"
  GORELEASER_VERSION: "~> v2"
  SYFT_VERSION: v1.50.0
  # cosign v3 defaults sign-blob to the new bundle format and rejects the
  # separate --output-signature/--output-certificate flags goreleaser uses
  # ("must specify --bundle with --new-bundle-format"). v2 keeps the .sig/.pem
  # output that docs/RELEASE.md verifies against.
  COSIGN_VERSION: v2.6.4
  GOWORK: "off"
  GOTOOLCHAIN: local

jobs:
  # ---------------------------------------------------------------------------
  # A tag must not be publishable unless the tree it points at is green. The
  # release job depends on this, so a broken tag fails before anything is built.
  # ---------------------------------------------------------------------------
  preflight:
    name: Preflight
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          # Release artifacts are published, so a poisoned module cache would be
          # a supply-chain compromise. Build from a cold cache instead.
          cache: false

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-dev+${GITHUB_SHA::12}"
          fi
          echo "version=${version}" >>"${GITHUB_OUTPUT}"
          echo "Releasing version ${version}"

      - name: Verify module graph
        run: |
          go mod verify
          go mod tidy -diff

      - name: Test with race detector
        run: go test ./... -race -timeout=20m

      - name: Golden snapshots must not drift
        run: |
          go test ./tests/snapshots
          if ! git diff --quiet -- tests/snapshots; then
            echo "::error::Golden snapshots drifted; refusing to release."
            git diff -- tests/snapshots
            exit 1
          fi

      - name: Validate GoReleaser configuration
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: check

  # ---------------------------------------------------------------------------
  # Build, sign, and publish. Runs on an ephemeral GitHub-hosted runner; the
  # signing identity comes from the workflow's OIDC token, which user-defined
  # build steps never see. See docs/RELEASE.md for the SLSA level claim.
  # ---------------------------------------------------------------------------
  release:
    name: Build and publish
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs:
      - preflight
    # Publish on a real release/tag event; a manual dispatch only publishes when
    # dry_run is explicitly false, otherwise it is a snapshot.
    env:
      PUBLISH: >-
        ${{ github.event_name == 'release' || github.event_name == 'push'
        || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false) }}
    permissions:
      # Create the release and upload assets.
      contents: write
      # Push the container image to GHCR.
      packages: write
      # Sigstore keyless signing and provenance attestation.
      id-token: write
      # Record attestations against the repository.
      attestations: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GoReleaser needs full history and tags to build the changelog.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          # Release artifacts are published, so a poisoned module cache would be
          # a supply-chain compromise. Build from a cold cache instead.
          cache: false

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: ${{ env.SYFT_VERSION }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@6ff44f8e5255f9d8aa31ef22f7e57a2d926b7da0 # v1.11.0

      - name: Log in to GitHub Container Registry
        if: ${{ env.PUBLISH == 'true' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The Blacksmith builder writes buildkitd.toml into the workspace; remove it
      # so goreleaser does not see a dirty tree and refuse to release. .gitignore
      # also covers it, but this guards older tags whose tree predates that entry.
      - name: Keep the builder config out of the release tree
        run: rm -f buildkitd.toml

      - name: Run GoReleaser
        id: goreleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: >-
            ${{ (env.PUBLISH == 'true' && 'release --clean')
            || 'release --clean --snapshot --skip=sign,publish' }}

      # ----------------------------------------------------------------------
      # SLSA build provenance. GitHub's attestation service signs the
      # provenance with an identity bound to this workflow at this ref, using
      # material the build steps cannot reach.
      # ----------------------------------------------------------------------
      - name: Attest build provenance for release artifacts
        if: ${{ env.PUBLISH == 'true' }}
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm

      - name: Attest the SBOMs
        if: ${{ env.PUBLISH == 'true' }}
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/*_checksums.txt
          sbom-path: >-
            ${{ github.workspace }}/dist/goreveal_${{
            needs.preflight.outputs.version }}_source.spdx.json

      # ----------------------------------------------------------------------
      # Verify what was just produced, from the consumer's point of view. A
      # release that cannot be verified is worse than no release.
      # ----------------------------------------------------------------------
      - name: Self-verify checksums, SBOMs, and signature
        run: |
          set -euo pipefail
          cd dist

          echo "::group::Checksums"
          checksums="$(ls -1 ./*_checksums.txt)"
          sha256sum --check --ignore-missing "${checksums}"
          echo "::endgroup::"

          echo "::group::SBOM structure"
          shopt -s nullglob
          sboms=(./*.spdx.json)
          if [ ${#sboms[@]} -eq 0 ]; then
            echo "::error::No SPDX SBOM was produced."
            exit 1
          fi
          for sbom in "${sboms[@]}"; do
            python3 - "${sbom}" <<'PY'
          import json
          import sys

          path = sys.argv[1]
          with open(path, encoding="utf-8") as handle:
              doc = json.load(handle)

          missing = [k for k in ("spdxVersion", "SPDXID", "name", "packages") if k not in doc]
          if missing:
              sys.exit(f"{path}: missing SPDX fields {missing}")
          print(f"{path}: SPDX {doc['spdxVersion']}, {len(doc['packages'])} packages")
          PY
          done
          echo "::endgroup::"

          if [ "${PUBLISH}" = "true" ]; then
            echo "::group::Cosign signature"
            workflow_path=".github/workflows/release.yml"
            identity="^https://github\.com/${GITHUB_REPOSITORY}/"
            identity+="${workflow_path//\//\\/}@${GITHUB_REF}$"
            cosign verify-blob \
              --certificate "${checksums}.pem" \
              --signature "${checksums}.sig" \
              --certificate-identity-regexp "${identity}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "${checksums}"
            echo "::endgroup::"
          fi

      - name: Verify the published binary runs and reports its identity
        run: |
          set -euo pipefail
          tarball="$(ls -1 dist/goreveal_*_linux_amd64.tar.gz)"
          workdir="$(mktemp -d)"
          tar -xzf "${tarball}" -C "${workdir}"
          "${workdir}/goreveal" version
          "${workdir}/goreveal" version --json

      - name: Upload release artifacts for inspection
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dist
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/*.spdx.json
            dist/*_checksums.txt*
          retention-days: 14
          if-no-files-found: error

      - name: Summarize
        if: always()
        run: |
          {
            echo "### Release ${{ needs.preflight.outputs.version }}"
            echo
            if [ "${PUBLISH}" = "true" ]; then
              url="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"
              echo "Published to <${url}>."
            else
              echo "Dry run — nothing was published."
            fi
            echo
            echo "| Artifact | Size |"
            echo "|---|---|"
            # shellcheck disable=SC2016  # the format string is find's, not the shell's
            find dist -maxdepth 1 -type f \
              \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.deb' -o -name '*.rpm' \
                 -o -name '*.spdx.json' -o -name '*_checksums.txt*' \) \
              -printf '| `%f` | %s bytes |\n' | sort
          } >>"${GITHUB_STEP_SUMMARY}"
