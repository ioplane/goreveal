---
name: OSSF Scorecard

# yamllint disable-line rule:truthy
on:
  # Scorecard needs branch-protection metadata, which is only readable from a
  # push or scheduled run on the default branch -- not from a pull request.
  branch_protection_rule: {}
  push:
    branches:
      - main
  schedule:
    - cron: "31 7 * * 2"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    # Scorecard measures a repository's public supply-chain posture and
    # `publish_results` requires a public repository. Skip cleanly while the
    # repository is private rather than reporting a red run for a condition the
    # configuration cannot fix.
    if: github.event.repository.private == false
    permissions:
      security-events: write
      # Required for the Scorecard badge and for publishing to the OpenSSF API.
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          # Publishing makes the score readable by consumers and enables the
          # README badge. It requires the repository to be public.
          publish_results: true

      - name: Upload results artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: scorecard-results.sarif
          retention-days: 5

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          sarif_file: scorecard-results.sarif
          category: scorecard
