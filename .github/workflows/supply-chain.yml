---
name: Supply chain

# yamllint disable-line rule:truthy
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: "12 6 * * 1"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: supply-chain-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GO_VERSION: "1.26.5"
  GOWORK: "off"
  GOTOOLCHAIN: local

jobs:
  # ---------------------------------------------------------------------------
  # License and advisory gate on dependency changes only.
  # ---------------------------------------------------------------------------
  dependency-review:
    name: Dependency review
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          # GoREveal ships under Apache-2.0 and deliberately keeps its distance
          # from the AGPL prior art it studies. A copyleft dependency would
          # break both the license and the clean-room posture.
          deny-licenses: >-
            AGPL-1.0-only, AGPL-1.0-or-later,
            AGPL-3.0-only, AGPL-3.0-or-later,
            GPL-2.0-only, GPL-2.0-or-later,
            GPL-3.0-only, GPL-3.0-or-later,
            SSPL-1.0,
            BUSL-1.1,
            CC-BY-NC-4.0

  # ---------------------------------------------------------------------------
  # Go vulnerability database, call-graph aware: reports only reachable issues.
  # ---------------------------------------------------------------------------
  govulncheck:
    name: govulncheck
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck -show verbose ./...

  # ---------------------------------------------------------------------------
  # Cross-ecosystem advisories (Go modules and the uv lockfile).
  # ---------------------------------------------------------------------------
  osv-scanner:
    name: OSV-Scanner
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check code-scanning availability
        id: code-scanning
        uses: ./.github/actions/code-scanning-available

      # v2.3.8. The repository root action.yml is not a usable composite action;
      # the scanner lives in the osv-scanner-action/ subdirectory.
      - name: Scan lockfiles
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2
        continue-on-error: true
        with:
          scan-args: |-
            --output=osv-results.sarif
            --format=sarif
            --recursive
            --skip-git
            ./

      - name: Upload SARIF to code scanning
        if: >-
          always() && hashFiles('osv-results.sarif') != ''
          && steps.code-scanning.outputs.available == 'true'
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          sarif_file: osv-results.sarif
          category: osv-scanner

  # ---------------------------------------------------------------------------
  # Committed-secret detection over full history. Complements Trivy's
  # content-based secret scan with git-aware detection.
  # ---------------------------------------------------------------------------
  gitleaks:
    name: Gitleaks
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # The gitleaks CLI is Apache-2.0 and needs no licence; only the wrapper
      # action requires a paid key for organisation-owned repositories. Running
      # the pinned image directly keeps history-aware scanning without one.
      - name: Scan history for secrets
        env:
          # gitleaks v8.30.1, digest-pinned.
          GITLEAKS_IMAGE: >-
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        run: |
          set -euo pipefail
          # --redact keeps the matched secret out of the log and the report.
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/repo" \
            "${GITLEAKS_IMAGE}" \
            git /repo \
              --redact \
              --no-banner \
              --report-format sarif \
              --report-path /repo/gitleaks.sarif \
              --exit-code 1

      - name: Check code-scanning availability
        if: always()
        id: code-scanning
        uses: ./.github/actions/code-scanning-available

      - name: Upload SARIF to code scanning
        if: >-
          always() && hashFiles('gitleaks.sarif') != ''
          && steps.code-scanning.outputs.available == 'true'
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  # ---------------------------------------------------------------------------
  # SBOM for the current tree. Release SBOMs are produced by GoReleaser; this
  # keeps a current-state SPDX document attached to every main-branch commit.
  # ---------------------------------------------------------------------------
  sbom:
    name: SPDX SBOM
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate SPDX JSON SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          artifact-name: goreveal-source-sbom.spdx.json
          output-file: goreveal-source-sbom.spdx.json
          upload-artifact: true
          upload-release-assets: false

      - name: Validate SBOM structure
        run: |
          python3 - <<'PY'
          import json
          import sys

          with open("goreveal-source-sbom.spdx.json", encoding="utf-8") as handle:
              doc = json.load(handle)

          required = ("spdxVersion", "SPDXID", "name", "packages")
          missing = [key for key in required if key not in doc]
          if missing:
              sys.exit(f"SBOM missing required SPDX fields: {missing}")

          packages = doc["packages"]
          print(f"SPDX {doc['spdxVersion']}: {len(packages)} packages")
          if not packages:
              sys.exit("SBOM contains no packages; the scan did not resolve dependencies")
          PY
