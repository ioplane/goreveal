---
name: Pull request hygiene

# yamllint disable-line rule:truthy
on:
  pull_request_target:
    types:
      - opened
      - reopened
      - edited
      - synchronize

permissions: {}

concurrency:
  group: pr-hygiene-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # pull_request_target is required so that labeling works on fork pull
  # requests. Nothing in this workflow checks out or executes pull request code
  # -- it only reads metadata and changed-file paths.
  title:
    name: Conventional commit title
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # Automated PRs (Dependabot, the Blacksmith migration app, release-please)
    # author their own already-conventional titles; don't red-X them mid-edit.
    if: >-
      github.event.pull_request.user.type != 'Bot'
      && github.actor != 'dependabot[bot]'
    permissions:
      pull-requests: read
    steps:
      - name: Validate title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
            security
          # Scopes are free-form: they name a package path such as
          # core/pclntab or engine/peeling.
          requireScope: false
          subjectPattern: ^(?![A-Z])(?!.*\.$).+$
          subjectPatternError: |
            The subject "{subject}" is invalid for the "{type}" type.

            It must start with a lowercase letter and must not end with a period.

              feat(core/pclntab): recover funcnametab offsets on stripped ELF

  label:
    name: Apply area labels
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Label by changed paths
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true
